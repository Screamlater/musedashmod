Combo2: 0,255,168
Combo3: 244,250,37
Combo4: 0,191,255

[Fonts]
HitCirclePrefix: default
HitCircleOverlap: 0
ScorePrefix: score
ScoreOverlap: 2

[Mania]
Keys: 4   //这是4K模式的参数，每个Keys对应其模式
ColumnStart: 230    //面板左侧的起始位置，数值越大越靠右
HitPosition: 465    //判定线高度，0~480，数值越大判定线越低
BarlineHeight: 0    //小节线厚度，建议不要大于2，0就是没有小节线
JudgementLine: 0    //是否显示精准判定线，不用改，游戏内可以设置
SpecialStyle: 0     //特殊键(皿)的位置，不用改，游戏内可以设置
UpsideDown: 0       //0为下落式，1为上升式
ComboPosition: 100  //Combo位置，数值越大Combo位置越低
ScorePosition: 230  //判定位置，数值越大判定位置越低
LightPosition: 466  //按键光位置，数值越大按键光位置越低，请保持该数值比判定线高度+1
WidthForNoteHeightScale: 50    //[特殊]锁定Note厚度，数值越大Note越厚 (使Note图片的厚度不受轨道宽度影响，参考下面这行↓)
ColumnWidth: 55,55,55,55       //每条轨道的宽度，数值越大越宽 (拉长轨道会使Note图片等比拉伸：Note变长后会增厚，反之亦然)
ColumnLineWidth: 0,0,0,0,0     //轨道分隔线的宽度，0就是没有分隔线

ColourHold: 230,230,230,230    //LN的Combo颜色
ColourBarline: 252,252,252,252 //小节线颜色
Colour1: 0,0,0,255
Colour2: 0,0,0,255
Colour3: 0,0,0,255
Colour4: 0,0,0,255             //该轨道的背景颜色(4k所以是4行代码)：R,G,B,透明度
ColourLight1: 250,180,150,220
ColourLight2: 250,180,150,220
ColourLight3: 250,180,150,220
ColourLight4: 250,180,150,220  //该轨道按键光效的颜色(4k所以是4行代码)：R,G,B，透明度

